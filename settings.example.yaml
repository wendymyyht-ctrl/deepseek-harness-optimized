# Optional advanced example. The Web UI at Settings → Models is easier.
# Save your real configuration to $DSH_HOME/settings.yaml, never to this repo.
llm-pi-ai:
  providers:
    my-openai-compatible-api:
      displayName: My OpenAI-compatible provider
      apiKeyEnv: MY_PROVIDER_API_KEY
      api: openai-completions
      baseURL: https://gateway.example/v1
      models:
        - id: my-model
          contextWindow: 262144
          maxTokens: 32768

# Optional private/local Vision Toolkit provider. Keep real credentials in the
# Harness credential store; this field is a credential reference, not a key.
# The endpoint must implement OpenAI-compatible multimodal Chat Completions.
vision-toolkit:
  provider:
    baseUrl: http://127.0.0.1:8000/v1
    credential: MY_LOCAL_VISION_CREDENTIAL
    model: my-local-vision-model
    protocol: openai
